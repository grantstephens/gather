version: "2"

run:
  timeout: 10m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose  # unclosed HTTP response bodies
    - misspell
    - unconvert  # redundant type conversions
  settings:
    staticcheck:
      checks:
        - all
        # purely stylistic quick-fixes and package-comment nags
        - -QF1001
        - -QF1008
        - -QF1012
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    presets:
      - std-error-handling # unchecked Close() etc.
      - common-false-positives
      - comments
    rules:
      # tests get a lighter touch
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
    paths:
      # shipped migrations are never edited
      - migrations

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: gather
  exclusions:
    paths:
      - migrations
