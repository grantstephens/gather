version: 2
updates:
  # Go modules (backend) — bundled into a single PR per week
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      golang:
        patterns:
          - "*"

  # npm packages (frontend) — bundled into a single PR per week
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"

  # GitHub Actions used in workflows — bundled into a single PR per week
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dockerfile base image (golang builder, alpine runtime) — gomod updates
  # never touch this, so it needs its own watch to stay in sync with go.mod
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
